name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Both packages are released together: the tool populates the cache and the build-only
      # package consumes it, and the --assets command line between them is versioned by nothing
      # else. A release that shipped one without the other would document a PackageReference
      # nobody can restore.
      - name: Validate versions match the tag
        run: |
          for PROJECT in src/NuGetToCompLog/NuGetToCompLog.csproj src/NuGetToCompLog.SourceBuild/NuGetToCompLog.SourceBuild.csproj; do
            PROJECT_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT")
            if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
              echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) doesn't match $PROJECT ($PROJECT_VERSION)"
              exit 1
            fi
          done

      - name: Pack
        run: |
          dotnet pack src/NuGetToCompLog/NuGetToCompLog.csproj -c Release -o ./artifacts
          dotnet pack src/NuGetToCompLog.SourceBuild/NuGetToCompLog.SourceBuild.csproj -c Release -o ./artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
